<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 150" role="img" aria-label="The chain does not break at the last link. It breaks at the first one. That is where the work starts." style="width:100%;height:auto;display:block"><rect width="1020" height="150" fill="#061034"/><defs><marker id="pc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="pc-e1" d="M 226 72 L 274 72" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pc-arrow)"></path><path id="pc-e2" d="M 482 72 L 530 72" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pc-arrow)"></path><path id="pc-e3" d="M 738 72 L 788 72" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pc-arrow)"></path><g><rect x="20" y="46" width="206" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="123" y="69" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Scattered sources</text><text x="123" y="87" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">every tool keeps its own numbers</text></g><g><rect x="276" y="46" width="206" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="379" y="69" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Broken trust</text><text x="379" y="87" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">reports disagree, people re-check</text></g><g><rect x="532" y="46" width="206" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="635" y="69" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Endless cleanup</text><text x="635" y="87" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">every team fixes its own copy</text></g><g><rect x="790" y="46" width="210" height="52" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="895" y="69" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">AI stalls</text><text x="895" y="87" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">pilots never reach production</text></g><text x="251" y="36" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">NUMBERS DRIFT</text><text x="507" y="36" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">CONFIDENCE DROPS</text><text x="764" y="36" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">NO CLEAN BASE</text><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.2s"></set><animateMotion dur="1.6s" begin="0.2s" repeatCount="indefinite"><mpath href="#pc-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.9s"></set><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#pc-e2"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"></set><animateMotion dur="1.6s" begin="1.6s" repeatCount="indefinite"><mpath href="#pc-e3"></mpath></animateMotion></circle></svg>