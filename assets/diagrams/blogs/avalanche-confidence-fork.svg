<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-label="Today&#x27;s bulletin shows danger level 3, considerable. That single number forks depending on which avalanche problem produced it: a wind slab problem, which is observable and testable, carries high confidence; a deep persistent slab, which hides for weeks and resists direct testing, carries low confidence despite showing the same headline number." style="width:100%;height:auto;display:block"><rect width="940" height="340" fill="#061034"/><defs><marker id="ac-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="ac-e1" d="M 155 139 L 183 139" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ac-arrow)"></path><g><rect x="15" y="112" width="140" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="85" y="143" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Today&#x27;s bulletin</text></g><g><rect x="185" y="112" width="230" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="300" y="136" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Danger: 3, considerable</text><text x="300" y="154" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">the headline number</text></g><text x="169" y="118" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">READS</text><path id="ac-fa" d="M 415 139 C 430 100, 420 70, 445 54" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#ac-arrow)"></path><path id="ac-e2" d="M 635 54 L 663 54" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ac-arrow)"></path><g><rect x="445" y="30" width="190" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="540" y="51" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Wind slab problem</text><text x="540" y="69" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">visible, testable</text></g><g><rect x="665" y="30" width="180" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="755" y="51" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">High confidence</text><text x="755" y="69" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">forecaster can point to it</text></g><text x="428" y="88" font-size="9.5" letter-spacing="0.8" fill="#03F856" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start">OBSERVABLE</text><path id="ac-fb" d="M 415 139 C 430 180, 420 210, 445 252" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#ac-arrow)"></path><path id="ac-e3" d="M 635 252 L 663 252" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ac-arrow)"></path><g><rect x="445" y="228" width="190" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="540" y="249" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Deep persistent slab</text><text x="540" y="267" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">hidden weak layer</text></g><g><rect x="665" y="228" width="180" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="755" y="249" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Low confidence</text><text x="755" y="267" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">hides for weeks</text></g><text x="428" y="198" font-size="9.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start">HARD TO TEST</text><line x1="755" y1="276" x2="755" y2="300" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="751" y="296" width="8" height="8" transform="rotate(45 755 300)" fill="#E8B437"></rect><text x="755" y="304" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">SAME NUMBER, LESS SURE</text></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.4s" begin="0s" repeatCount="indefinite"><mpath href="#ac-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.8s"></set><animateMotion dur="1.8s" begin="0.8s" repeatCount="indefinite"><mpath href="#ac-fa"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2s"></set><animateMotion dur="1.2s" begin="2s" repeatCount="indefinite"><mpath href="#ac-e2"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.8s"></set><animateMotion dur="1.8s" begin="0.8s" repeatCount="indefinite"><mpath href="#ac-fb"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2s"></set><animateMotion dur="1.2s" begin="2s" repeatCount="indefinite"><mpath href="#ac-e3"></mpath></animateMotion></circle></svg>