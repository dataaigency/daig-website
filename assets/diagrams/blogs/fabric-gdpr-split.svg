<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 310" role="img" aria-label="Personal data enters Fabric and splits into two lanes. Microsoft&#x27;s part: a capacity in an EU region, an audited platform with SOC 2 and ISO 27001 reports, and tenant metadata, some of which stays in the home region. Your part: what you load, who can see it, and erasure on request, where old table versions survive a plain delete until you vacuum them." style="width:100%;height:auto;display:block"><rect width="1020" height="310" fill="#061034"/><defs><marker id="fg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><text x="235" y="22" font-size="10.5" letter-spacing="1" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">MICROSOFT&#x27;S PART: THE PLATFORM</text><text x="235" y="205" font-size="10.5" letter-spacing="1" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">YOUR PART: THE DATA</text><line x1="215" y1="165" x2="1005" y2="165" stroke="#24356E" stroke-width="1.2" stroke-dasharray="5 5"></line><g><rect x="15" y="138" width="150" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="90" y="162" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Personal data</text><text x="90" y="180" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">customers, staff</text></g><path id="fg-up" d="M 165 160 C 200 140, 200 70, 233 60" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#fg-arrow)"></path><path id="fg-dn" d="M 165 170 C 200 190, 200 235, 233 240" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#fg-arrow)"></path><path id="fg-t0" d="M 445 60 L 473 60" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#fg-arrow)"></path><path id="fg-t1" d=