<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="Personal data flows into the Power BI service in an EU region, where Microsoft acts as processor under its data protection addendum. From there it forks three ways, all the customer&#x27;s responsibility. Publish to web creates a public link anyone can open with no sign-in. Export to Excel puts a copy outside the service. A named seat with row-level security lets each reader see only their own rows." style="width:100%;height:auto;display:block"><rect width="1040" height="320" fill="#061034"/><defs><marker id="pg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="pg-e1" d="M 160 157 L 188 157" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pg-arrow)"></path><g><rect x="10" y="130" width="150" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="85" y="154" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Personal data</text><text x="85" y="172" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">customers, staff</text></g><g><rect x="190" y="130" width="200" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="290" y="154" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Power BI service</text><text x="290" y="172" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">EU region, processor</text></g><text x="290" y="214" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">MICROSOFT&#x27;S PART ENDS HERE</text><g><path id="pg-f0" d="M 390 157 C 410 157, 405 44, 430 44" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#pg-arrow)"></path><path id="pg-g0" d="M 640 44 L 678 44" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pg-arrow)"></path><g><rect x="432" y="20" width="208" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="536" y="41" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Publish to web</text><text x="536" y="59" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">public link, no sign-in</text></g><g><rect x="680" y="20" width="190" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="775" y="41" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Anyone can open it</text><text x="775" y="59" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">no audit of viewers</text></g><g><rect x="881" y="40" width="8" height="8" transform="rotate(45 885 44)" fill="#E8B437"></rect><text x="899" y="48" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start" dy="0">TENANT SETTING: OFF</text></g></g><g><path id="pg-f1" d="M 390 157 C 410 157, 405 154, 430 154" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#pg-arrow)"></path><path id="pg-g1" d="M 640 154 L 678 154" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pg-arrow)"></path><g><rect x="432" y="130" width="208" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="536" y="151" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Export to Excel</text><text x="536" y="169" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">a copy leaves the service</text></g><g><rect x="680" y="130" width="190" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="775" y="151" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Lives in inboxes</text><text x="775" y="169" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">outside your controls</text></g><g><rect x="881" y="150" width="8" height="8" transform="rotate(45 885 154)" fill="#E8B437"></rect><text x="899" y="158" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start" dy="0">LIMIT BY GROUP</text></g></g><g><path id="pg-f2" d="M 390 157 C 410 157, 405 264, 430 264" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#pg-arrow)"></path><path id="pg-g2" d="M 640 264 L 678 264" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pg-arrow)"></path><g><rect x="432" y="240" width="208" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="536" y="261" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Named seat + row filter</text><text x="536" y="279" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">sign-in, row-level security</text></g><g><rect x="680" y="240" width="190" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="775" y="261" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Each reader sees their rows</text><text x="775" y="279" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">access you can show</text></g><text x="899" y="268" font-size="10.5" letter-spacing="0.8" fill="#03F856" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start">YOUR DESIGN</text></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite"><mpath href="#pg-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.2s"></set><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite"><mpath href="#pg-f0"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.2s"></set><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite"><mpath href="#pg-f1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.2s"></set><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite"><mpath href="#pg-f2"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2.6s"></set><animateMotion dur="1.2s" begin="2.6s" repeatCount="indefinite"><mpath href="#pg-g0"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2.6s"></set><animateMotion dur="1.2s" begin="2.6s" repeatCount="indefinite"><mpath href="#pg-g1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2.6s"></set><animateMotion dur="1.2s" begin="2.6s" repeatCount="indefinite"><mpath href="#pg-g2"></mpath></animateMotion></circle></svg>