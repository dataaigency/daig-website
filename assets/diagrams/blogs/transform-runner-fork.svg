<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 345" role="img" aria-label="SQL models in Git fork into three routes that all end in the same BigQuery project. Dataform runs inside Google Cloud at no licence cost with nothing to run, but works with BigQuery only. dbt Core has no licence cost but runs on a runner you maintain, including its secrets and upgrades. The hosted dbt platform costs about 91 euros per seat per month and adds a second vendor and a second data processing agreement. BigQuery bills the SQL, not the tool." style="width:100%;height:auto;display:block"><rect width="1020" height="345" fill="#061034"/><defs><marker id="tr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><g><rect x="15" y="143" width="170" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="100" y="167" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Your SQL models</text><text x="100" y="185" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">in Git, linked by ref()</text></g><path id="tr-a1" d="M 185 170 C 241 170, 241 56, 298 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#tr-arrow)"></path><path id="tr-b1" d="M 185 170 L 298 170" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#tr-arrow)"></path><path id="tr-c1" d="M 185 170 C 241 170, 241 284, 298 284" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#tr-arrow)"></path><g><rect x="300" y="30" width="250" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="425" y="53" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Dataform</text><text x="425" y="71" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">runs inside Google Cloud</text></g><g><rect x="300" y="144" width="250" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="425" y="167" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">dbt Core</text><text x="425" y="185" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">open source, on a runner you own</text></g><g><rect x="300" y="258" width="250" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="425" y="281" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">dbt platform</text><text x="425" y="299" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">hosted for you, as a subscription</text></g><path id="tr-a2" d="M 550 56 C 674 56, 674 170, 798 170" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#tr-arrow)"></path><path id="tr-b2" d="M 550 170 L 798 170" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#tr-arrow)"></path><path id="tr-c2" d="M 550 284 C 674 284, 674 170, 798 170" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#tr-arrow)"></path><text x="565" y="44" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start">€0, NOTHING TO RUN</text><text x="565" y="162" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start">€0 LICENCE, YOU RUN IT</text><text x="565" y="306" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start">ABOUT €91 A SEAT A MONTH</text><g><rect x="308" y="94" width="8" height="8" transform="rotate(45 312 98)" fill="#E8B437"></rect><text x="326" y="102" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start" dy="0">BIGQUERY ONLY</text></g><g><rect x="308" y="208" width="8" height="8" transform="rotate(45 312 212)" fill="#E8B437"></rect><text x="326" y="216" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start" dy="0">RUNNER, SECRETS, UPGRADES: YOURS</text></g><g><rect x="308" y="322" width="8" height="8" transform="rotate(45 312 326)" fill="#E8B437"></rect><text x="326" y="330" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start" dy="0">SECOND VENDOR, SECOND DPA</text></g><g><rect x="800" y="143" width="205" height="54" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="902.5" y="167" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">BigQuery</text><text x="902.5" y="185" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">bills the SQL, not the tool</text></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.4s" begin="0s" repeatCount="indefinite"><mpath href="#tr-a1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.3s"></set><animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite"><mpath href="#tr-b1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.6s"></set><animateMotion dur="1.4s" begin="0.6s" repeatCount="indefinite"><mpath href="#tr-c1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.4s"></set><animateMotion dur="1.8s" begin="1.4s" repeatCount="indefinite"><mpath href="#tr-a2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.7s"></set><animateMotion dur="1.8s" begin="1.7s" repeatCount="indefinite"><mpath href="#tr-b2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2s"></set><animateMotion dur="1.8s" begin="2s" repeatCount="indefinite"><mpath href="#tr-c2"></mpath></animateMotion></circle></svg>