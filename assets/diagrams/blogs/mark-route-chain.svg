<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 262" role="img" aria-label="Four nodes left to right: the model, the route you call it through, your own code, and the user. Text flows along them and reaches the user with the mark intact, shown in green. Under each of the first three an amber tag marks where the mark can be lost: the model has no mark built in, the route is not covered, or your edits strip it. A line underneath says any break puts the marking duty back on you." style="width:100%;height:auto;display:block"><rect width="1020" height="262" fill="#061034"/><defs><marker id="mrc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="mrc-e1" d="M 185 98 L 263 98" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#mrc-arrow)"></path><path id="mrc-e2" d="M 445 98 L 523 98" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#mrc-arrow)"></path><path id="mrc-e3" d="M 715 98 L 798 98" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#mrc-arrow)"></path><text x="225" y="90" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">CALLS</text><text x="485" y="90" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">RETURNS</text><text x="757" y="90" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">SHIPS</text><g><g><rect x="15" y="70" width="170" height="56" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="100" y="95" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Model</text><text x="100" y="113" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">vendor&#x27;s mark, or none</text></g><line x1="100" y1="126" x2="100" y2="160" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="96" y="160" width="8" height="8" transform="rotate(45 100 164)" fill="#E8B437"></rect><text x="100" y="168" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">NO MARK BUILT IN</text></g></g><g><g><rect x="265" y="70" width="180" height="56" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="355" y="95" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Route</text><text x="355" y="113" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">direct API or cloud partner</text></g><line x1="355" y1="126" x2="355" y2="160" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="351" y="160" width="8" height="8" transform="rotate(45 355 164)" fill="#E8B437"></rect><text x="355" y="168" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">ROUTE NOT COVERED</text></g></g><g><g><rect x="525" y="70" width="190" height="56" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="620" y="95" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Your code</text><text x="620" y="113" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">rewrite, translate, sample</text></g><line x1="620" y1="126" x2="620" y2="160" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="616" y="160" width="8" height="8" transform="rotate(45 620 164)" fill="#E8B437"></rect><text x="620" y="168" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">EDITS STRIP IT</text></g></g><g><rect x="800" y="70" width="205" height="56" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="902.5" y="95" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Reaches the user</text><text x="902.5" y="113" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">mark intact, duty covered</text></g><text x="20" y="30" font-size="11" letter-spacing="1.6" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start">ONE CHAIN, THREE PLACES TO LOSE THE MARK</text><line x1="20" y1="214" x2="715" y2="214" stroke="#E8B437" stroke-width="1.2" stroke-dasharray="3 4"></line><text x="20" y="240" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start">ANY BREAK: THE MARKING DUTY IS BACK ON YOU</text><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite"><mpath href="#mrc-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.6s"></set><animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite"><mpath href="#mrc-e2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.2s"></set><animateMotion dur="1.2s" begin="1.2s" repeatCount="indefinite"><mpath href="#mrc-e3"></mpath></animateMotion></circle></svg>