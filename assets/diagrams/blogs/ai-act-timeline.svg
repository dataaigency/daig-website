<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 250" role="img" aria-label="A timeline from February 2025 to August 2028 with five EU AI Act obligations. Today, August 2026, is marked at the transparency and AI literacy stop; the two later stops, Annex III and Annex I high-risk rules, are flagged as moved from their original date." style="width:100%;height:auto;display:block"><rect width="1030" height="250" fill="#061034"/><defs><marker id="ai-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="ai-e0" d="M 190 116 L 218 116" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ai-arrow)"></path><path id="ai-e1" d="M 395 116 L 423 116" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ai-arrow)"></path><path id="ai-e2" d="M 600 116 L 628 116" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ai-arrow)"></path><path id="ai-e3" d="M 805 116 L 833 116" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ai-arrow)"></path><g><text x="102.5" y="54" font-size="11" letter-spacing="1.2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">FEB 2025</text><g><rect x="15" y="90" width="175" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="102.5" y="113" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Prohibited practices</text><text x="102.5" y="131" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">banned since 2025</text></g></g><g><text x="307.5" y="54" font-size="11" letter-spacing="1.2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">AUG 2025</text><g><rect x="220" y="90" width="175" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"><