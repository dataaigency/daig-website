<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 250" role="img" aria-label="Side by side: a warehouse accepting only structured tables, and a lakehouse holding open-format files and tables in one store." style="width:100%;height:auto;display:block"><rect width="1020" height="250" fill="#061034"/><defs><marker id="wl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><text x="20" y="26" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">WAREHOUSE</text><path d="M 200 122 L 248 122" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#wl-arrow)"></path><g><rect x="20" y="98" width="180" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="110" y="119" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Structured tables</text><text x="110" y="137" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">only</text></g><g><rect x="250" y="52" width="220" height="146" rx="10" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="266" y="76" font-size="12.5" font-weight="700" fill="#E8ECF6" font-family="'Space Grotesk', 'Segoe UI', sans-serif">Warehouse</text><g><rect x="266" y="92" width="188" height="26" rx="5" fill="#0E2258" stroke="#24356E" stroke-width="1"></rect><text x="360" y="109" font-size="11" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">tables</text></g><g><rect x="266" y="128" width="188" height="26" rx="5" fill="#0E2258" stroke="#24356E" stroke-width="1"></rect><text x="360" y="145" font-size="11" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">SQL engine</text></g><text x="266" y="182" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif">structured data only</text></g><line x1="510" y1="20" x2="510" y2="230" stroke="#24356E" stroke-width="1.2" stroke-dasharray="4 5"></line><text x="550" y="26" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">LAKEHOUSE</text><path d="M 690 82 C 716 82, 712 100, 736 106" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#wl-arrow)"></path><path d="M 690 166 C 716 166, 712 148, 736 140" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#wl-arrow)"></path><g><rect x="550" y="58" width="140" height="44" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="620" y="84" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Tables</text></g><g><rect x="550" y="144" width="140" height="44" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="620" y="163" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Files · events</text><text x="620" y="181" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">logs, exports, json</text></g><g><rect x="738" y="52" width="262" height="146" rx="10" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="754" y="76" font-size="12.5" font-weight="700" fill="#E8ECF6" font-family="'Space Grotesk', 'Segoe UI', sans-serif">Lakehouse</text><g><rect x="754" y="92" width="230" height="26" rx="5" fill="#0E2258" stroke="#24356E" stroke-width="1"></rect><text x="869" y="109" font-size="11" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">files, open formats (Delta, Iceberg)</text></g><g><rect x="754" y="128" width="230" height="26" rx="5" fill="#0E2258" stroke="#24356E" stroke-width="1"></rect><text x="869" y="145" font-size="11" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">tables, same engine</text></g><text x="754" y="182" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif">one governed store for both</text></g></svg>