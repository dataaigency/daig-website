roke-width="1.5"></rect><text x="947" y="182" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Viewer</text></g><line x1="785" y1="182" x2="785" y2="222" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="781" y="218" width="8" height="8" transform="rotate(45 785 222)" fill="#E8B437"></rect><text x="785" y="226" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">CREATORS STILL NEED PRO</text></g><text x="540" y="272" font-size="10.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">BREAK-EVEN ABOUT 390 VIEWERS</text><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.2s"></set><animateMotion dur="1.3s" begin="0.2s" repeatCount="indefinite"><mpath href="#pc-l0"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.1s"></set><animateMotion dur="1.3s" begin="1.1s" repeatCount="indefinite"><mpath href="#pc-l1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.2s"></set><animateMotion dur="1.3s" begin="0.2s" repeatCount="indefinite"><mpath href="#pc-r0"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.1s"></set><animateMotion dur="1.3s" begin="1.1s" repeatCount="indefinite"><mpath href="#pc-r1"></mpath></animateMotion></circle></svg>