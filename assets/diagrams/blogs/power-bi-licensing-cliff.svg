<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 300" role="img" aria-label="Two halves side by side. On the left, an F2 to F32 capacity feeds its reports through a Power BI Pro seat gate that every viewer has to pass, so cost scales per head. On the right, an F64 or larger capacity feeds the same viewers with that gate removed, although report creators still need a Pro licence." style="width:100%;height:auto;display:block"><rect width="1020" height="300" fill="#061034"/><defs><marker id="pc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><text x="20" y="26" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">F2 TO F32</text><path id="pc-l0" d="M 160 125 L 206 125" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pc-arrow)"></path><g><rect x="20" y="98" width="140" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="90" y="122" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Capacity</text><text x="90" y="140" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">the engines</text></g><g><rect x="210" y="68" width="110" height="114" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="265" y="112" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Pro seat</text><text x="265" y="130" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">per viewer</text><text x="265" y="154" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">~ €13 / MO</text></g><path id="pc-l1" d="M 320 125 L 362 125" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pc-arrow)"></path><path d="M 320 125 C 344 125, 340 72, 362 72" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pc-arrow)"></path><path d="M 320 125 C 344 125, 340 178, 362 178" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pc-arrow)"></path><g><rect x="364" y="52" width="136" height="40" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="432" y="76" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Viewer</text></g><g><rect x="364" y="105" width="136" height="40" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="432" y="129" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Viewer</text></g><g><rect x="364" y="158" width="136" height="40" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="432" y="182" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Viewer</text></g><line x1="432" y1="198" x2="432" y2="222" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="428" y="218" width="8" height="8" transform="rotate(45 432 222)" fill="#E8B437"></rect><text x="432" y="226" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">COST SCALES PER HEAD</text></g><line x1="510" y1="16" x2="510" y2="284" stroke="#24356E" stroke-width="1.2" stroke-dasharray="4 5"></line><text x="540" y="26" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">F64 AND ABOVE</text><path id="pc-r0" d="M 680 125 L 726 125" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pc-arrow)"></path><g><rect x="540" y="98" width="140" height="54" rx="8" fill="#0B1C4E" strok