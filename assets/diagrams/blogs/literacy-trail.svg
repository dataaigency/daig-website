<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 175" role="img" aria-label="A chain of five steps: AI tools in use, who touches them, what each role needs, a measure is taken, and a dated record. Each of the first four steps is flagged with the gap that usually breaks it: shadow use, contractors forgotten, one course for everyone, nothing scheduled. The last step, the dated record, is the evidence you can show." style="width:100%;height:auto;display:block"><rect width="1040" height="175" fill="#061034"/><defs><marker id="lt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="lt-e0" d="M 180 56 L 220 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#lt-arrow)"></path><path id="lt-e1" d="M 392 56 L 432 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#lt-arrow)"></path><path id="lt-e2" d="M 604 56 L 644 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#lt-arrow)"></path><path id="lt-e3" d="M 816 56 L 856 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#lt-arrow)"></path><g><g><rect x="10" y="32" width="170" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="95" y="53" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">AI tools in use</text><text x="95" y="71" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">the real list</text></g><line x1="95" y1="80" x2="95" y2="108" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="91" y="104" width="8" height="8" transform="rotate(45 95 108)" fill="#E8B437"></rect><text x="95" y="112" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">SHADOW USE</text></g></g><g><g><rect x="222" y="32" width="170" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="307" y="53" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Who touches them</text><text x="307" y="71" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">staff and contractors</text></g><line x1="307" y1="80" x2="307" y2="108" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="303" y="104" width="8" height="8" transform="rotate(45 307 108)" fill="#E8B437"></rect><text x="307" y="112" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">CONTRACTORS FORGOTTEN</text></g></g><g><g><rect x="434" y="32" width="170" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="519" y="53" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">What each role needs</text><text x="519" y="71" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">sales is not finance</text></g><line x1="519" y1="80" x2="519" y2="108" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="515" y="104" width="8" height="8" transform="rotate(45 519 108)" fill="#E8B437"></rect><text x="519" y="112" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">ONE COURSE FOR ALL</text></g></g><g><g><rect x="646" y="32" width="170" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="731" y="53" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">A measure is taken</text><text x="731" y="71" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">session, guide, rule</text></g><line x1="731" y1="80" x2="731" y2="108" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="727" y="104" width="8" height="8" transform="rotate(45 731 108)" fill="#E8B437"></rect><text x="731" y="112" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">NOTHING SCHEDULED</text></g></g><g><rect x="858" y="32" width="170" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="943" y="53" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">A dated record</text><text x="943" y="71" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">who, what, when</text></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.3s" begin="0s" repeatCount="indefinite"><mpath href="#lt-e0"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.5s"></set><animateMotion dur="1.3s" begin="0.5s" repeatCount="indefinite"><mpath href="#lt-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1s"></set><animateMotion dur="1.3s" begin="1s" repeatCount="indefinite"><mpath href="#lt-e2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.5s"></set><animateMotion dur="1.3s" begin="1.5s" repeatCount="indefinite"><mpath href="#lt-e3"></mpath></animateMotion></circle></svg>