<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 190" role="img" aria-label="A prompt travels left to right through three gates: endpoint, retention and grounding. Under each gate an amber tag names the default that leaks: a global endpoint can process anywhere, caching and abuse logs keep prompts, and Google Search grounding stores search data. The prompt ends at a green node: processed in the EU, nothing kept." style="width:100%;height:auto;display:block"><rect width="1020" height="190" fill="#061034"/><defs><marker id="vg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="vg-e0" d="M 150 67 L 202 67" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#vg-arrow)"></path><path id="vg-e1" d="M 375 67 L 412 67" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#vg-arrow)"></path><path id="vg-e2" d="M 585 67 L 622 67" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#vg-arrow)"></path><path id="vg-e4" d="M 795 67 L 827 67" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#vg-arrow)"></path><g><rect x="20" y="40" width="130" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="85" y="64" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Your prompt</text><text x="85" y="82" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">with personal data</text></g><g><g><rect x="205" y="40" width="170" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="290" y="64" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Endpoint</text><text x="290" y="82" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">choose the EU one</text></g><line x1="290" y1="94" x2="290" y2="130" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="286" y="126" width="8" height="8" transform="rotate(45 290 130)" fill="#E8B437"></rect><text x="290" y="134" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">GLOBAL: ANY LOCATION</text></g></g><g><g><rect x="415" y="40" width="170" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="500" y="64" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Retention</text><text x="500" y="82" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">caching off, exception</text></g><line x1="500" y1="94" x2="500" y2="130" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="496" y="126" width="8" height="8" transform="rotate(45 500 130)" fill="#E8B437"></rect><text x="500" y="134" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">CACHE AND ABUSE LOGS</text></g></g><g><g><rect x="625" y="40" width="170" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="710" y="64" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Grounding</text><text x="710" y="82" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">skip plain Search grounding</text></g><line x1="710" y1="94" x2="710" y2="130" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="706" y="126" width="8" height="8" transform="rotate(45 710 130)" fill="#E8B437"></rect><text x="710" y="134" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">SEARCH LOGS KEPT</text></g></g><g><rect x="830" y="40" width="170" height="54" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="915" y="64" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">EU-processed, not kept</text><text x="915" y="82" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">the goal</text></g><text x="178" y="50" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">SENT</text><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite"><mpath href="#vg-e0"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1s"></set><animateMotion dur="1.2s" begin="1s" repeatCount="indefinite"><mpath href="#vg-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2s"></set><animateMotion dur="1.2s" begin="2s" repeatCount="indefinite"><mpath href="#vg-e2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="3s"></set><animateMotion dur="1.2s" begin="3s" repeatCount="indefinite"><mpath href="#vg-e3"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="4s"></set><animateMotion dur="1.2s" begin="4s" repeatCount="indefinite"><mpath href="#vg-e4"></mpath></animateMotion></circle></svg>