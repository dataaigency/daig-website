<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 245" role="img" aria-label="Three messy sources land raw in the shoebox, are cleaned once into one table, and feed a single paddle-out decision." style="width:100%;height:auto;display:block"><rect width="1020" height="245" fill="#061034"/><defs><marker id="sp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="sp-s0" d="M 200 50 C 250 50, 244 122, 292 122" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#sp-arrow)"></path><path id="sp-s1" d="M 200 122 C 250 122, 244 122, 292 122" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#sp-arrow)"></path><path id="sp-s2" d="M 200 194 C 250 194, 244 122, 292 122" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#sp-arrow)"></path><path id="sp-e1" d="M 514 122 L 578 122" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#sp-arrow)"></path><path id="sp-e2" d="M 788 122 L 850 122" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#sp-arrow)"></path><g><rect x="20" y="28" width="180" height="44" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="110" y="54" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Buoy readings</text></g><g><rect x="20" y="100" width="180" height="44" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="110" y="126" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Wind forecast</text></g><g><rect x="20" y="172" width="180" height="44" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="110" y="198" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Tide table</text></g><g><rect x="294" y="94" width="220" height="56" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><rect x="352.7" y="110" width="8" height="8" fill="#C9884A"></rect><text x="404" y="119" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">The shoebox</text><text x="404" y="137" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">raw copies, never edited</text></g><g><rect x="580" y="94" width="208" height="56" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><rect x="619.5" y="110" width="8" height="8" fill="#AFB9C8"></rect><text x="684" y="119" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">One clean table</text><text x="684" y="137" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">fixed once, for everyone</text></g><g><rect x="852" y="94" width="148" height="56" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="926" y="119" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Paddle out?</text><text x="926" y="137" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">one honest answer</text></g><text x="247" y="78" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">LAND</text><text x="546" y="110" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">CLEAN ONCE</text><text x="820" y="110" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">DECIDE</text><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite"><mpath href="#sp-s0"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.6s"></set><animateMotion dur="2.2s" begin="0.6s" repeatCount="indefinite"><mpath href="#sp-s1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.2s"></set><animateMotion dur="2.2s" begin="1.2s" repeatCount="indefinite"><mpath href="#sp-s2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.9s"></set><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#sp-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.7s"></set><animateMotion dur="1.6s" begin="1.7s" repeatCount="indefinite"><mpath href="#sp-e2"></mpath></animateMotion></circle></svg>