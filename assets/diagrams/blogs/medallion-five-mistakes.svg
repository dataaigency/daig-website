<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 240" role="img" aria-label="Bronze, Silver and Gold layers with five numbered failure patterns marked at the layer or seam where each occurs." style="width:100%;height:auto;display:block"><rect width="1020" height="240" fill="#061034"/><defs><marker id="mm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="mm-e1" d="M 320 120 L 388 120" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#mm-arrow)"></path><path id="mm-e2" d="M 570 120 L 638 120" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#mm-arrow)"></path><g><rect x="140" y="94" width="180" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><rect x="195.2" y="108" width="8" height="8" fill="#C9884A"></rect><text x="230" y="117" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Bronze</text><text x="230" y="135" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">raw, as it arrived</text></g><g><rect x="390" y="94" width="180" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><rect x="445.2" y="108" width="8" height="8" fill="#AFB9C8"></rect><text x="480" y="117" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Silver</text><text x="480" y="135" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">cleaned and tested</text></g><g><rect x="640" y="94" width="180" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><rect x="701.8" y="108" width="8" height="8" fill="#E8B437"></rect><text x="730" y="117" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Gold</text><text x="730" y="135" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">business-ready</text></g><line x1="230" y1="60" x2="230" y2="92" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="226" y="20" width="8" height="8" transform="rotate(45 230 24)" fill="#E8B437"></rect><text x="230" y="28" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">1 · EDITS IN RAW DATA</text></g><line x1="480" y1="148" x2="480" y2="176" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="476" y="172" width="8" height="8" transform="rotate(45 480 176)" fill="#E8B437"></rect><text x="494" y="180" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start" dy="0">2 · RENAMED, NEVER TESTED</text></g><line x1="730" y1="60" x2="730" y2="92" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="726" y="20" width="8" height="8" transform="rotate(45 730 24)" fill="#E8B437"></rect><text x="730" y="28" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">3 · ONE TABLE PER DASHBOARD</text></g><line x1="354" y1="148" x2="354" y2="176" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="350" y="172" width="8" height="8" transform="rotate(45 354 176)" fill="#E8B437"></rect><text x="340" y="180" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="end" dy="0">4 · FOLDERS, NOT CONTRACTS</text></g><line x1="604" y1="60" x2="604" y2="92" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="600" y="20" width="8" height="8" transform="rotate(45 604 24)" fill="#E8B437"></rect><text x="590" y="28" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="end" dy="0">5 · NOBODY OWNS THE LAYOUT</text></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.3s"></set><animateMotion dur="1.7s" begin="0.3s" repeatCount="indefinite"><mpath href="#mm-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.1s"></set><animateMotion dur="1.7s" begin="1.1s" repeatCount="indefinite"><mpath href="#mm-e2"></mpath></animateMotion></circle></svg>