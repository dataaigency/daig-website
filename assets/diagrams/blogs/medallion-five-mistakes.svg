<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 320" role="img" aria-label="Bronze, Silver and Gold layers with numbered markers: failures 1 to 3 sit inside the layers, 4 and 5 sit on the seams between them; a key below names each one." style="width:100%;height:auto;display:block"><rect width="1020" height="320" fill="#061034"/><defs><marker id="mm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="mm-e1" d="M 320 76 L 388 76" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#mm-arrow)"></path><path id="mm-e2" d="M 570 76 L 638 76" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#mm-arrow)"></path><g><rect x="140" y="50" width="180" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><rect x="195.2" y="64" width="8" height="8" fill="#C9884A"></rect><text x="230" y="73" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Bronze</text><text x="230" y="91" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">raw, as it arrived</text></g><g><rect x="390" y="50" width="180" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><rect x="445.2" y="64" width="8" height="8" fill="#AFB9C8"></rect><text x="480" y="73" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Silver</text><text x="480" y="91" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">cleaned and tested</text></g><g><rect x="640" y="50" width="180" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><rect x="701.8" y="64" width="8" height="8" fill="#E8B437"></rect><text x="730" y="73" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Gold</text><text x="730" y="91" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">business-ready</text></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.3s"></set><animateMotion dur="1.7s" begin="0.3s" repeatCount="indefinite"><mpath href="#mm-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.1s"></set><animateMotion dur="1.7s" begin="1.1s" repeatCount="indefinite"><mpath href="#mm-e2"></mpath></animateMotion></circle><g><rect x="223.5" y="43.5" width="13" height="13" transform="rotate(45 230 50)" fill="#E8B437"></rect><text x="230" y="53.5" font-size="9.5" font-weight="700" fill="#061034" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">1</text></g><g><rect x="473.5" y="43.5" width="13" height="13" transform="rotate(45 480 50)" fill="#E8B437"></rect><text x="480" y="53.5" font-size="9.5" font-weight="700" fill="#061034" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">2</text></g><g><rect x="723.5" y="43.5" width="13" height="13" transform="rotate(45 730 50)" fill="#E8B437"></rect><text x="730" y="53.5" font-size="9.5" font-weight="700" fill="#061034" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">3</text></g><g><rect x="347.5" y="69.5" width="13" height="13" transform="rotate(45 354 76)" fill="#E8B437"></rect><text x="354" y="79.5" font-size="9.5" font-weight="700" fill="#061034" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">4</text></g><g><rect x="597.5" y="69.5" width="13" height="13" transform="rotate(45 604 76)" fill="#E8B437"></rect><text x="604" y="79.5" font-size="9.5" font-weight="700" fill="#061034" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">5</text></g><line x1="140" y1="148" x2="880" y2="148" stroke="#24356E" stroke-width="1" stroke-dasharray="3 5"></line><text x="140" y="186" font-size="10" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">INSIDE THE LAYERS</text><g><g><rect x="140.5" y="205.5" width="13" height="13" transform="rotate(45 147 212)" fill="#E8B437"></rect><text x="147" y="215.5" font-size="9.5" font-weight="700" fill="#061034" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">1</text></g><text x="166" y="216" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace">EDITS IN RAW DATA</text></g><g><g><rect x="140.5" y="235.5" width="13" height="13" transform="rotate(45 147 242)" fill="#E8B437"></rect><text x="147" y="245.5" font-size="9.5" font-weight="700" fill="#061034" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">2</text></g><text x="166" y="246" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace">RENAMED, NEVER TESTED</text></g><g><g><rect x="140.5" y="265.5" width="13" height="13" transform="rotate(45 147 272)" fill="#E8B437"></rect><text x="147" y="275.5" font-size="9.5" font-weight="700" fill="#061034" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">3</text></g><text x="166" y="276" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace">ONE TABLE PER DASHBOARD</text></g><text x="600" y="186" font-size="10" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">IN THE SEAMS</text><g><g><rect x="600.5" y="205.5" width="13" height="13" transform="rotate(45 607 212)" fill="#E8B437"></rect><text x="607" y="215.5" font-size="9.5" font-weight="700" fill="#061034" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">4</text></g><text x="626" y="216" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace">FOLDERS, NOT CONTRACTS</text></g><g><g><rect x="600.5" y="235.5" width="13" height="13" transform="rotate(45 607 242)" fill="#E8B437"></rect><text x="607" y="245.5" font-size="9.5" font-weight="700" fill="#061034" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">5</text></g><text x="626" y="246" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace">NOBODY OWNS THE LAYOUT</text></g></svg>