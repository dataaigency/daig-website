<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 360" role="img" aria-label="A customer table is pseudonymised, swapping IDs for tokens, while the key or lookup table is kept separately and stays personal data for you. The tokenised extract then forks three ways. To a processor under a data processing agreement, it is still personal data, with no exemption. To an independent party that holds nothing to join it to, it is not personal data for them. To a recipient who can link it, for example with its own customer list, it becomes personal data again." style="width:100%;height:auto;display:block"><rect width="1030" height="360" fill="#061034"/><defs><marker id="pk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="pk-e1" d="M 130 170 L 198 170" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pk-arrow)"></path><path id="pk-e2" d="M 360 170 L 418 170" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pk-arrow)"></path><g><rect x="10" y="143" width="120" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="70" y="167" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Customer table</text><text x="70" y="185" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">names, emails</text></g><g><rect x="200" y="143" width="160" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="280" y="167" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Pseudonymise</text><text x="280" y="185" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">swap IDs for tokens</text></g><g><rect x="420" y="143" width="170" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="505" y="167" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Tokenised extract</text><text x="505" y="185" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">what leaves your hands</text></g><text x="165" y="162" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">TOKENISE</text><text x="390" y="162" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">EXPORT</text><line x1="280" y1="197" x2="280" y2="262" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="200" y="262" width="160" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="280" y="283" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Key / lookup table</text><text x="280" y="301" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">kept separately</text></g><g><rect x="276" y="322" width="8" height="8" transform="rotate(45 280 326)" fill="#E8B437"></rect><text x="280" y="330" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">YOURS: ALWAYS PERSONAL</text></g><path id="pk-fa" d="M 590 170 C 615 130, 620 70, 648 54" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#pk-arrow)"></path><path id="pk-ea" d="M 830 54 L 853 54" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pk-arrow)"></path><g><rect x="650" y="30" width="180" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="740" y="51" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Processor under DPA</text><text x="740" y="69" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">agency, BI vendor</text></g><g><rect x="855" y="30" width="165" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="937.5" y="51" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Still personal data</text><text x="937.5" y="69" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Art. 25a(4): no exemption</text></g><text x="600" y="112" font-size="9.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="end">PROCESSOR</text><path id="pk-fm" d="M 590 170 L 648 170" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#pk-arrow)"></path><path id="pk-em" d="M 830 170 L 853 170" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pk-arrow)"></path><g><rect x="650" y="146" width="180" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="740" y="167" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Independent party</text><text x="740" y="185" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">holds nothing to join</text></g><g><rect x="855" y="146" width="165" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="937.5" y="167" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Not personal for them</text><text x="937.5" y="185" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">if truly no means</text></g><text x="619" y="162" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">NO KEY</text><path id="pk-fb" d="M 590 170 C 615 210, 620 270, 648 286" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#pk-arrow)"></path><path id="pk-eb" d="M 830 286 L 853 286" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pk-arrow)"></path><g><rect x="650" y="262" width="180" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="740" y="283" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Recipient who can link</text><text x="740" y="301" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">e.g. own customer list</text></g><g><rect x="855" y="262" width="165" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="937.5" y="283" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Personal data again</text><text x="937.5" y="301" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">the handover counts too</text></g><text x="600" y="236" font-size="9.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="end">CAN LINK</text><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.4s" begin="0s" repeatCount="indefinite"><mpath href="#pk-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.8s"></set><animateMotion dur="1.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#pk-e2"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"></set><animateMotion dur="1.6s" begin="1.6s" repeatCount="indefinite"><mpath href="#pk-fa"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2.8s"></set><animateMotion dur="1s" begin="2.8s" repeatCount="indefinite"><mpath href="#pk-ea"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"></set><animateMotion dur="1.2s" begin="1.6s" repeatCount="indefinite"><mpath href="#pk-fm"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2.8s"></set><animateMotion dur="1s" begin="2.8s" repeatCount="indefinite"><mpath href="#pk-em"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"></set><animateMotion dur="1.6s" begin="1.6s" repeatCount="indefinite"><mpath href="#pk-fb"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2.8s"></set><animateMotion dur="1s" begin="2.8s" repeatCount="indefinite"><mpath href="#pk-eb"></mpath></animateMotion></circle></svg>