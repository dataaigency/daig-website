<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 270" role="img" aria-label="Two rows. Pilot: a hand-picked extract, fixed by hand by someone, ends in a demo that works. Production: live sources, with nobody fixing them, end in answers that drift. A dashed line separates the rows." style="width:100%;height:auto;display:block"><rect width="1020" height="270" fill="#061034"/><defs><marker id="pg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><text x="10" y="60" font-size="10.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">PILOT</text><text x="10" y="210" font-size="10.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">PRODUCTION</text><line x1="10" y1="135" x2="1010" y2="135" stroke="#24356E" stroke-width="1.2" stroke-dasharray="5 5"></line><path id="pg-t0" d="M 340 56 L 408 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pg-arrow)"></path><path id="pg-t1" d="M 620 56 L 688 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pg-arrow)"></path><g><rect x="130" y="32" width="210" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="235" y="53" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Hand-picked extract</text><text x="235" y="71" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">a few thousand clean rows</text></g><g><rect x="410" y="32" width="210" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="515" y="53" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Someone fixes it</text><text x="515" y="71" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">by hand, quietly</text></g><g><rect x="690" y="32" width="210" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="795" y="53" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">The demo works</text><text x="795" y="71" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">applause</text></g><text x="375" y="48" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">CLEAN</text><text x="655" y="48" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">FEEDS</text><path id="pg-b0" d="M 340 206 L 408 206" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#pg-arrow)"></path><path id="pg-b1" d="M 620 206 L 688 206" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#pg-arrow)"></path><g><rect x="130" y="182" width="210" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="235" y="203" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Live sources</text><text x="235" y="221" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">duplicates, gaps, renames</text></g><g><rect x="410" y="182" width="210" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="515" y="203" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Nobody fixes it</text><text x="515" y="221" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">no owner, no checks</text></g><g><rect x="690" y="182" width="210" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="795" y="203" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Answers drift</text><text x="795" y="221" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">trust drops, use stops</text></g><text x="375" y="198" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">RAW</text><text x="655" y="198" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">FEEDS</text><g><rect x="511" y="238" width="8" height="8" transform="rotate(45 515 242)" fill="#E8B437"></rect><text x="515" y="246" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">THE MISSING LAYER</text></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.3s" begin="0s" repeatCount="indefinite"><mpath href="#pg-t0"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.6s"></set><animateMotion dur="1.3s" begin="0.6s" repeatCount="indefinite"><mpath href="#pg-t1"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.3s"></set><animateMotion dur="1.3s" begin="0.3s" repeatCount="indefinite"><mpath href="#pg-b0"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.9s"></set><animateMotion dur="1.3s" begin="0.9s" repeatCount="indefinite"><mpath href="#pg-b1"></mpath></animateMotion></circle></svg>