<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" role="img" aria-label="A current provider on the left and a new provider on the right, joined by two lanes. Top lane, free from 12 January 2027: notice of at most two months, then a 30-day transition, then your data moves out with a switching charge of zero euros. Bottom lane, not covered by the law, in amber: pipelines, models and reports built on the old platform have to be rebuilt by your team. Two amber flags: a fixed-term contract can still carry an exit penalty, and running both clouds in parallel still costs egress at the provider&#x27;s cost." style="width:100%;height:auto;display:block"><rect width="1020" height="340" fill="#061034"/><defs><marker id="ce-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><g><rect x="15" y="130" width="180" height="60" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="105" y="157" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Current provider</text><text x="105" y="175" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">you give notice</text></g><g><rect x="805" y="130" width="200" height="60" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="905" y="157" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">New provider</text><text x="905" y="175" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">data in, logic rebuilt</text></g><text x="255" y="34" font-size="11" letter-spacing="1.6" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start">FREE FROM 12 JAN 2027</text><path id="ce-a" d="M 195 150 C 232 150, 220 74, 253 74" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#ce-arrow)"></path><g><rect x="255" y="48" width="210" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="360" y="71" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Notice, then transition</text><text x="360" y="89" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">max 2 months, then 30 days</text></g><path id="ce-b" d="M 465 74 L 543 74" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#ce-arrow)"></path><text x="504" y="60" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">NO FEE</text><g><rect x="545" y="48" width="200" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="645" y="71" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Your data moves out</text><text x="645" y="89" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">switching charge: €0</text></g><path id="ce-c" d="M 745 74 C 790 74, 770 150, 803 150" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#ce-arrow)"></path><text x="255" y="208" font-size="11" letter-spacing="1.6" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start">NOT COVERED BY THE LAW</text><path id="ce-d" d="M 195 170 C 232 170, 220 246, 253 246" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#ce-arrow)"></path><g><rect x="255" y="220" width="210" height="52" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="360" y="243" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Pipelines, models, reports</text><text x="360" y="261" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">built on the old platform</text></g><path id="ce-e" d="M 465 246 L 543 246" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#ce-arrow)"></path><text x="504" y="232" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">BY HAND</text><g><rect x="545" y="220" width="200" height="52" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="645" y="243" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Rebuilt by your team</text><text x="645" y="261" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">the real cost of leaving</text></g><path id="ce-f" d="M 745 246 C 790 246, 770 170, 803 170" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#ce-arrow)"></path><line x1="105" y1="190" x2="105" y2="284" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="101" y="284" width="8" height="8" transform="rotate(45 105 288)" fill="#E8B437"></rect><text x="105" y="292" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">FIXED TERM: EXIT PENALTY</text></g><line x1="645" y1="272" x2="645" y2="284" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="641" y="284" width="8" height="8" transform="rotate(45 645 288)" fill="#E8B437"></rect><text x="645" y="292" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">PARALLEL RUN: EGRESS AT COST</text></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.5s" begin="0s" repeatCount="indefinite"><mpath href="#ce-a"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.2s"></set><animateMotion dur="1.2s" begin="1.2s" repeatCount="indefinite"><mpath href="#ce-b"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2.2s"></set><animateMotion dur="1.5s" begin="2.2s" repeatCount="indefinite"><mpath href="#ce-c"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.4s"></set><animateMotion dur="1.9s" begin="0.4s" repeatCount="indefinite"><mpath href="#ce-d"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2s"></set><animateMotion dur="2.4s" begin="2s" repeatCount="indefinite"><mpath href="#ce-e"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="4s"></set><animateMotion dur="1.9s" begin="4s" repeatCount="indefinite"><mpath href="#ce-f"></mpath></animateMotion></circle></svg>