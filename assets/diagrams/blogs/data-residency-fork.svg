<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" role="img" aria-label="Your data flows into an EU data center, which satisfies residency. The chain then asks who legally controls the provider. One branch, a US-owned provider, still lets a CLOUD Act warrant reach the data regardless of location, rare in practice but legally real. The other branch, an EU-incorporated entity with no US parent, keeps the data under EU law only, usually at a premium of ten to fifteen percent." style="width:100%;height:auto;display:block"><rect width="1040" height="340" fill="#061034"/><defs><marker id="rj-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="rj-e1" d="M 145 139 L 173 139" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#rj-arrow)"></path><path id="rj-e2" d="M 365 139 L 393 139" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#rj-arrow)"></path><g><rect x="15" y="112" width="130" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="80" y="143" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Your data</text></g><g><rect x="175" y="112" width="190" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="270" y="136" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">EU data center</text><text x="270" y="154" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">at rest: EU region</text></g><g><rect x="395" y="112" width="210" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="500" y="136" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Who 