<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 175" role="img" aria-label="A data stack from sources to dashboards, with the typical trouble spot flagged under each part." style="width:100%;height:auto;display:block"><rect width="1020" height="175" fill="#061034"/><defs><marker id="am-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="am-e0" d="M 200 56 L 278 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#am-arrow)"></path><path id="am-e1" d="M 460 56 L 538 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#am-arrow)"></path><path id="am-e2" d="M 720 56 L 798 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#am-arrow)"></path><g><g><rect x="20" y="32" width="180" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="110" y="60" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Sources</text></g><line x1="110" y1="80" x2="110" y2="108" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="106" y="104" width="8" height="8" transform="rotate(45 110 108)" fill="#E8B437"></rect><text x="110" y="112" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">MANUAL EXPORTS</text></g></g><g><g><rect x="280" y="32" width="180" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="370" y="60" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Pipelines</text></g><line x1="370" y1="80" x2="370" y2="108" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="366" y="104" width="8" height="8" transform="rotate(45 370 108)" fill="#E8B437"></rect><text x="370" y="112" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">UNTESTED JOINS</text></g></g><g><g><rect x="540" y="32" width="180" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="630" y="60" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Warehouse / lake</text></g><line x1="630" y1="80" x2="630" y2="108" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="626" y="104" width="8" height="8" transform="rotate(45 630 108)" fill="#E8B437"></rect><text x="630" y="112" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">ONE PERSON KNOWS IT</text></g></g><g><g><rect x="800" y="32" width="200" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="900" y="60" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Dashboards</text></g><line x1="900" y1="80" x2="900" y2="108" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="896" y="104" width="8" height="8" transform="rotate(45 900 108)" fill="#E8B437"></rect><text x="900" y="112" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">NUMBERS DISAGREE</text></g></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.2s"></set><animateMotion dur="1.7s" begin="0.2s" repeatCount="indefinite"><mpath href="#am-e0"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.9s"></set><animateMotion dur="1.7s" begin="0.9s" repeatCount="indefinite"><mpath href="#am-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"></set><animateMotion dur="1.7s" begin="1.6s" repeatCount="indefinite"><mpath href="#am-e2"></mpath></animateMotion></circle></svg>