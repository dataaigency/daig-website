<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 330" role="img" aria-label="A left to right chain: business apps feed one database, Power BI Pro reads it, and readers each hold a Pro seat. Below Power BI, three amber tripwires hang off the chain: a model over 1 GB, refreshes over 8 times a day, and sources nobody owns. Any of them leads to the final green node: now Fabric earns its bill." style="width:100%;height:auto;display:block"><rect width="1020" height="330" fill="#061034"/><defs><marker id="st-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="st-e1" d="M 170 66 L 213 66" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#st-arrow)"></path><path id="st-e2" d="M 385 66 L 433 66" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#st-arrow)"></path><path id="st-e3" d="M 615 66 L 663 66" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#st-arrow)"></path><g><rect x="20" y="39" width="150" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="95" y="63" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Business apps</text><text x="95" y="81" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">CRM, shop, finance</text></g><g><rect x="215" y="39" width="170" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="300" y="63" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">One database</text><text x="300" y="81" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Postgres or SQL</text></g><g><rect x="435" y="39" width="180" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="525" y="63" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Power BI Pro</text><text x="525" y="81" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">import, scheduled</text></g><g><rect x="665" y="39" width="160" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="745" y="63" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Readers</text><text x="745" y="81" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">about €13 a seat</text></g><text x="191" y="46" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">LOAD</text><text x="409" y="46" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">IMPORT</text><text x="639" y="46" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">SHARE</text><line x1="525" y1="93" x2="525" y2="140" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><text x="540" y="134" font-size="9.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start">TRIPWIRES</text><g><g><rect x="380" y="168" width="290" height="40" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="525" y="192" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Model over 1 GB</text></g><path id="st-t0" d="M 670 188 C 710 188, 720 238, 760 238" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#st-arrow)"></path></g><g><g><rect x="380" y="222" width="290" height="40" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="525" y="246" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Refresh over 8 times a day</text></g><path id="st-t1" d="M 670 242 C 710 242, 720 238, 760 238" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#st-arrow)"></path></g><g><g><rect x="380" y="276" width="290" height="40" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="525" y="300" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Sources nobody owns</text></g><path id="st-t2" d="M 670 296 C 710 296, 720 238, 760 238" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#st-arrow)"></path></g><line x1="380" y1="140" x2="670" y2="140" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><line x1="380" y1="140" x2="380" y2="188" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="762" y="208" width="236" height="60" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="880" y="235" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Now Fabric earns its bill</text><text x="880" y="253" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">pause it, size it small</text></g><text x="20" y="310" font-size="10.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">UNTIL ONE TRIPS, FABRIC ONLY ADDS A BILL</text><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite"><mpath href="#st-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.9s"></set><animateMotion dur="1.2s" begin="0.9s" repeatCount="indefinite"><mpath href="#st-e2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.8s"></set><animateMotion dur="1.2s" begin="1.8s" repeatCount="indefinite"><mpath href="#st-e3"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1s"></set><animateMotion dur="1.6s" begin="1s" repeatCount="indefinite"><mpath href="#st-t1"></mpath></animateMotion></circle></svg>