<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" role="img" aria-label="Two datasets, one in the EU multi-region and one in europe-west3 Frankfurt, feed a query job that runs in a single location. If the job joins both, it fails with a location mismatch. If one dataset is copied or replicated into the other&#x27;s location first, the join runs in one place." style="width:100%;height:auto;display:block"><rect width="1040" height="310" fill="#061034"/><defs><marker id="bl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="bl-e1" d="M 215 67 C 270 67, 280 135, 328 140" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#bl-arrow)"></path><path id="bl-e2" d="M 215 233 C 270 233, 280 165, 328 160" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#bl-arrow)"></path><g><rect x="15" y="40" width="200" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="115" y="64" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">EU multi-region</text><text x="115" y="82" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">BigQuery picks Belgium or NL</text></g><g><rect x="15" y="206" width="200" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="115" y="230" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">europe-west3</text><text x="115" y="248" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Frankfurt, locked at creation</text></g><g><rect x="330" y="123" width="190" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="425" y="147" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">One query job</text><text x="425" y="165" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">runs in one location</text></g><text x="262" y="40" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">READ</text><text x="262" y="282" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">READ</text><path id="bl-fa" d="M 520 140 C 570 120, 590 80, 640 66" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#bl-arrow)"></path><path id="bl-ea" d="M 830 66 L 858 66" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#bl-arrow)"></path><g><rect x="640" y="42" width="190" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="735" y="63" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Join both as they are</text><text x="735" y="81" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">two locations, one job</text></g><g><rect x="860" y="42" width="165" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="942.5" y="63" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Job fails</text><text x="942.5" y="81" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">not found in location</text></g><text x="586" y="42" font-size="9.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">AS IS</text><line x1="942" y1="90" x2="942" y2="114" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="938" y="110" width="8" height="8" transform="rotate(45 942 114)" fill="#E8B437"></rect><text x="942" y="118" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">MISMATCH</text></g><path id="bl-fb" d="M 520 160 C 570 190, 590 232, 640 244" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#bl-arrow)"></path><path id="bl-eb" d="M 830 244 L 858 244" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#bl-arrow)"></path><g><rect x="640" y="220" width="190" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="735" y="241" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Copy or replicate first</text><text x="735" y="259" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">one side moves</text></g><g><rect x="860" y="220" width="165" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="942.5" y="241" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Join in one place</text><text x="942.5" y="259" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">the job runs</text></g><text x="590" y="282" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">MOVE FIRST</text><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite"><mpath href="#bl-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.4s"></set><animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite"><mpath href="#bl-e2"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"></set><animateMotion dur="1.6s" begin="1.6s" repeatCount="indefinite"><mpath href="#bl-fa"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2.8s"></set><animateMotion dur="1s" begin="2.8s" repeatCount="indefinite"><mpath href="#bl-ea"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"></set><animateMotion dur="1.6s" begin="1.6s" repeatCount="indefinite"><mpath href="#bl-fb"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2.8s"></set><animateMotion dur="1s" begin="2.8s" repeatCount="indefinite"><mpath href="#bl-eb"></mpath></animateMotion></circle></svg>