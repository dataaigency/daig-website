<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 240" role="img" aria-label="Two halves side by side. On the left, a Fabric capacity runs on wall-clock time and bills the same whether it sits idle or busy, landing on a fixed floor around one hundred sixty five to two hundred seventy eight euros a month. On the right, a BigQuery query is metered by bytes scanned, the first tebibyte each month is free, and the bill tracks actual usage." style="width:100%;height:auto;display:block"><rect width="1020" height="240" fill="#061034"/><defs><marker id="pm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><text x="20" y="26" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">FABRIC: RENT THE ENGINE</text><path id="pm-l0" d="M 180 108 L 226 108" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pm-arrow)"></path><g><rect x="20" y="82" width="160" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="100" y="105" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Capacity (F2+)</text><text x="100" y="123" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">pay as you go</text></g><g><rect x="228" y="82" width="252" height="52" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="354" y="105" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Runs on wall clock</text><text x="354" y="123" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">idle or busy, same meter</text></g><line x1="354" y1="134" x2="354" y2="158" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="350" y="154" width="8" height="8" transform="rotate(45 354 158)" fill="#E8B437"></rect><text x="354" y="162" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">FLOOR ~€165 TO €278 / MO</text></g><line x1="510" y1="16" x2="510" y2="224" stroke="#24356E" stroke-width="1.2" stroke-dasharray="4 5"></line><text x="540" y="26" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">BIGQUERY: PAY PER QUERY</text><path id="pm-r0" d="M 700 108 L 746 108" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pm-arrow)"></path><g><rect x="540" y="82" width="160" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="620" y="112" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Query submitted</text></g><g><rect x="748" y="82" width="252" height="52" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="874" y="105" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Bytes scanned, metered</text><text x="874" y="123" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">bill tracks usage</text></g><line x1="874" y1="134" x2="874" y2="158" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="870" y="154" width="8" height="8" transform="rotate(45 874 158)" fill="#03F856"></rect><text x="874" y="178" font-size="10.5" letter-spacing="0.8" fill="#03F856" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">FIRST 1 TIB / MO FREE</text></g><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.2s"></set><animateMotion dur="1.5s" begin="0.2s" repeatCount="indefinite"><mpath href="#pm-l0"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.2s"></set><animateMotion dur="1.5s" begin="0.2s" repeatCount="indefinite"><mpath href="#pm-r0"></mpath></animateMotion></circle></svg>