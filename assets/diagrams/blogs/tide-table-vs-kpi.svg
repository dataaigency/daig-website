<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" role="img" aria-label="Two rows. Top row, the tide table: years of gauge records and the moon and sun are fitted once into constants, published as one dated annual edition, and the skipper, the harbour and the surfer all read the same high water time. Bottom row, an unpublished KPI: raw orders are recomputed by the sales team, the finance team and an AI agent, each with its own rule for revenue, producing three different numbers." style="width:100%;height:auto;display:block"><rect width="1040" height="340" fill="#061034"/><defs><marker id="tt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><text x="15" y="22" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">TIDE TABLE</text><g><rect x="15" y="40" width="170" height="56" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="100" y="65" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Gauge records</text><text x="100" y="83" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">years of readings</text></g><path id="tt-a" d="M 185 68 L 243 68" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#tt-arrow)"></path><text x="214" y="52" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">FIT ONCE</text><g><rect x="245" y="40" width="170" height="56" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="330" y="65" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Constants</text><text x="330" y="83" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">moon and sun cycles</text></g><path id="tt-b" d="M 415 68 L 473 68" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#tt-arrow)"></path><text x="444" y="52" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">COMPUTE</text><g><rect x="475" y="40" width="190" height="56" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="570" y="65" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Published edition</text><text x="570" y="83" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">dated, one for all</text></g><path id="tt-c" d="M 665 68 C 700 68, 700 68, 733 68" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#tt-arrow)"></path><text x="699" y="52" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">READ</text><g><rect x="735" y="40" width="290" height="56" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="880" y="65" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Skipper, harbour, surfer</text><text x="880" y="83" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">same high water time</text></g><line x1="15" y1="150" x2="1025" y2="150" stroke="#24356E" stroke-width="1.2" stroke-dasharray="4 5"></line><text x="15" y="176" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">UNPUBLISHED KPI</text><g><rect x="15" y="228" width="170" height="56" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="100" y="253" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Raw orders</text><text x="100" y="271" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">rows, no agreed rule</text></g><path id="tt-d" d="M 185 256 C 220 256, 215 200, 245 200" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#tt-arrow)"></path><path id="tt-e" d="M 185 256 L 243 256" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#tt-arrow)"></path><path id="tt-f" d="M 185 256 C 220 256, 215 312, 245 312" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#tt-arrow)"></path><g><rect x="245" y="184" width="190" height="32" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="340" y="204" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Sales rule</text></g><g><rect x="245" y="240" width="190" height="32" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="340" y="260" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Finance rule</text></g><g><rect x="245" y="296" width="190" height="32" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="340" y="316" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">AI agent&#x27;s guess</text></g><path id="tt-g" d="M 435 200 L 563 200" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#tt-arrow)"></path><path id="tt-h" d="M 435 256 L 563 256" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#tt-arrow)"></path><path id="tt-i" d="M 435 312 L 563 312" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#tt-arrow)"></path><g><rect x="565" y="184" width="170" height="32" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="650" y="204" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Revenue, number one</text></g><g><rect x="565" y="240" width="170" height="32" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="650" y="260" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Revenue, number two</text></g><g><rect x="565" y="296" width="170" height="32" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="650" y="316" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Revenue, number three</text></g><g><rect x="771" y="254" width="8" height="8" transform="rotate(45 775 258)" fill="#E8B437"></rect><text x="789" y="262" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="start" dy="0">THREE ANSWERS, ONE QUESTION</text></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite"><mpath href="#tt-a"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1s"></set><animateMotion dur="1.2s" begin="1s" repeatCount="indefinite"><mpath href="#tt-b"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2s"></set><animateMotion dur="1.2s" begin="2s" repeatCount="indefinite"><mpath href="#tt-c"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.3s"></set><animateMotion dur="1.2s" begin="0.3s" repeatCount="indefinite"><mpath href="#tt-d"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.6s"></set><animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite"><mpath href="#tt-e"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.9s"></set><animateMotion dur="1.2s" begin="0.9s" repeatCount="indefinite"><mpath href="#tt-f"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.8s"></set><animateMotion dur="1.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#tt-g"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2.1s"></set><animateMotion dur="1.4s" begin="2.1s" repeatCount="indefinite"><mpath href="#tt-h"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2.4s"></set><animateMotion dur="1.4s" begin="2.4s" repeatCount="indefinite"><mpath href="#tt-i"></mpath></animateMotion></circle></svg>