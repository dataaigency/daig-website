<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 280" role="img" aria-label="Two halves. Left: no one calls the tune, so player one picks a key and player two picks different chord changes, and their two independently chosen paths converge into a clash of wrong notes. Right: someone calls the tune&#x27;s key and chord changes first, so both players improvise on that shared form, and their two paths converge into music landing together." style="width:100%;height:auto;display:block"><rect width="1040" height="280" fill="#061034"/><defs><marker id="sf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><text x="15" y="26" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">NO TUNE CALLED</text><g><rect x="15" y="104" width="145" height="56" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="87.5" y="129" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">No tune called</text><text x="87.5" y="147" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">nobody states the key</text></g><path id="sf-la" d="M 160 132 C 180 132, 180 42, 200 42" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#sf-arrow)"></path><path id="sf-lb" d="M 160 132 C 180 132, 180 210, 200 210" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#sf-arrow)"></path><g><rect x="200" y="20" width="155" height="44" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="277.5" y="39" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Player one</text><text x="277.5" y="57" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">picks a key</text></g><g><rect x="200" y="188" width="155" height="44" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="277.5" y="207" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Player two</text><text x="277.5" y="225" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">picks different changes</text></g><path id="sf-lc" d="M 355 42 C 372 42, 372 132, 385 132" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#sf-arrow)"></path><path id="sf-ld" d="M 355 210 C 372 210, 372 132, 385 132" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#sf-arrow)"></path><g><rect x="385" y="104" width="145" height="56" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="457.5" y="129" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Clash</text><text x="457.5" y="147" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">wrong notes, stalled tune</text></g><line x1="530" y1="10" x2="530" y2="270" stroke="#24356E" stroke-width="1.2" stroke-dasharray="4 5"></line><text x="560" y="26" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">TUNE CALLED FIRST</text><g><rect x="560" y="104" width="145" height="56" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="632.5" y="129" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Tune called first</text><text x="632.5" y="147" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">key + changes, once</text></g><path id="sf-ra" d="M 705 132 C 725 132, 725 42, 745 42" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#sf-arrow)"></path><path id="sf-rb" d="M 705 132 C 725 132, 725 210, 745 210" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#sf-arrow)"></path><g><rect x="745" y="20" width="155" height="44" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="822.5" y="39" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Player one</text><text x="822.5" y="57" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">plays the form</text></g><g><rect x="745" y="188" width="155" height="44" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="822.5" y="207" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Player two</text><text x="822.5" y="225" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">plays the form</text></g><path id="sf-rc" d="M 900 42 C 917 42, 917 132, 930 132" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#sf-arrow)"></path><path id="sf-rd" d="M 900 210 C 917 210, 917 132, 930 132" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#sf-arrow)"></path><g><rect x="930" y="104" width="95" height="56" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="977.5" y="129" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Music</text><text x="977.5" y="147" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">lands together</text></g><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.2s"></set><animateMotion dur="1.5s" begin="0.2s" repeatCount="indefinite"><mpath href="#sf-la"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.5s"></set><animateMotion dur="1.5s" begin="0.5s" repeatCount="indefinite"><mpath href="#sf-lb"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.4s"></set><animateMotion dur="1.3s" begin="1.4s" repeatCount="indefinite"><mpath href="#sf-lc"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.7s"></set><animateMotion dur="1.3s" begin="1.7s" repeatCount="indefinite"><mpath href="#sf-ld"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.2s"></set><animateMotion dur="1.5s" begin="0.2s" repeatCount="indefinite"><mpath href="#sf-ra"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.5s"></set><animateMotion dur="1.5s" begin="0.5s" repeatCount="indefinite"><mpath href="#sf-rb"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.4s"></set><animateMotion dur="1.3s" begin="1.4s" repeatCount="indefinite"><mpath href="#sf-rc"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.7s"></set><animateMotion dur="1.3s" begin="1.7s" repeatCount="indefinite"><mpath href="#sf-rd"></mpath></animateMotion></circle></svg>