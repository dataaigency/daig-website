<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-label="Top row, one threshold: a wind reading feeds one alarm set above 20 knots, which rings on every gust, mostly harmless ones, so the alarm gets ignored, including the one that mattered. Bottom row, a window: the same reading passes three checks in order, in range for the kite you rigged, gust spread small, direction not offshore. If all pass, go out. Any no, stay on shore." style="width:100%;height:auto;display:block"><rect width="1040" height="330" fill="#061034"/><defs><marker id="ww-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><text x="15" y="22" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">ONE THRESHOLD</text><path id="ww-a1" d="M 165 61 L 273 61" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ww-arrow)"></path><path id="ww-a2" d="M 465 61 L 573 61" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#ww-arrow)"></path><path id="ww-a3" d="M 765 61 L 873 61" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#ww-arrow)"></path><g><rect x="15" y="36" width="150" height="50" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="90" y="58" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Wind reading</text><text x="90" y="76" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">gusts 14 to 26 kn</text></g><g><rect x="275" y="36" width="190" height="50" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="370" y="58" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">One alarm</text><text x="370" y="76" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">above 20 knots</text></g><g><rect x="575" y="36" width="190" height="50" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="670" y="58" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Rings on every gust</text><text x="670" y="76" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">mostly harmless ones</text></g><g><rect x="875" y="36" width="150" height="50" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="950" y="58" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Ignored</text><text x="950" y="76" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">the real one too</text></g><text x="219" y="40" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">FEEDS</text><text x="519" y="40" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">FIRES</text><text x="819" y="40" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">TEACHES</text><line x1="15" y1="120" x2="1025" y2="120" stroke="#24356E" stroke-width="1.2" stroke-dasharray="4 5"></line><text x="15" y="156" font-size="11" letter-spacing="2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">A WINDOW</text><path id="ww-b1" d="M 145 201 L 183 201" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ww-arrow)"></path><path id="ww-b2" d="M 345 201 L 383 201" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#ww-arrow)"></path><path id="ww-b3" d="M 545 201 L 583 201" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#ww-arrow)"></path><path id="ww-b4" d="M 745 201 L 833 201" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#ww-arrow)"></path><g><rect x="15" y="176" width="130" height="50" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="80" y="198" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Wind reading</text><text x="80" y="216" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">same numbers</text></g><g><rect x="185" y="176" width="160" height="50" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="265" y="198" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">In range?</text><text x="265" y="216" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">for the kite rigged</text></g><g><rect x="385" y="176" width="160" height="50" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="465" y="198" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Gusts near lulls?</text><text x="465" y="216" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">spread stays small</text></g><g><rect x="585" y="176" width="160" height="50" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="665" y="198" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Not offshore?</text><text x="665" y="216" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">direction checked</text></g><g><rect x="835" y="176" width="190" height="50" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="930" y="198" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Go out</text><text x="930" y="216" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">three yeses</text></g><text x="789" y="180" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">ALL PASS</text><line x1="465" y1="226" x2="465" y2="262" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="461" y="258" width="8" height="8" transform="rotate(45 465 262)" fill="#E8B437"></rect><text x="465" y="266" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">ANY NO: STAY ON SHORE</text></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.3s" begin="0s" repeatCount="indefinite"><mpath href="#ww-a1"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.4s"></set><animateMotion dur="1.3s" begin="1.4s" repeatCount="indefinite"><mpath href="#ww-a2"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2.8s"></set><animateMotion dur="1.3s" begin="2.8s" repeatCount="indefinite"><mpath href="#ww-a3"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="0.8s" begin="0s" repeatCount="indefinite"><mpath href="#ww-b1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.9s"></set><animateMotion dur="0.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#ww-b2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.8s"></set><animateMotion dur="0.8s" begin="1.8s" repeatCount="indefinite"><mpath href="#ww-b3"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2.7s"></set><animateMotion dur="1.2s" begin="2.7s" repeatCount="indefinite"><mpath href="#ww-b4"></mpath></animateMotion></circle></svg>