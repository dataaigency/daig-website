<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 400" role="img" aria-label="Your AI workload picks a model, which forks three ways. Top: an EU-incorporated provider like Mistral or Aleph Alpha closes CLOUD Act exposure entirely. Middle: a US-owned model such as Claude, GPT or Gemini hosted in an AWS Bedrock, Vertex AI or eu.api region buys data residency but the CLOUD Act can still reach it. Bottom: the same US-owned models called directly or on a version without an EU host default to US storage with no residency at all." style="width:100%;height:auto;display:block"><rect width="1020" height="400" fill="#061034"/><defs><marker id="lm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="lm-e1" d="M 165 192 L 183 192" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#lm-arrow)"></path><g><rect x="15" y="165" width="150" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="90" y="196" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Your AI workload</text></g><g><rect x="185" y="165" width="190" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="280" y="189" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Pick a model</text><text x="280" y="207" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">which provider, which host</text></g><path id="lm-fa" d="M 375 192 C 388 100, 388 60, 400 40" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#lm-arrow)"></path><path id="lm-fb" d="M 375 192 L 400 192" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#lm-arrow)"></path><path id="lm-fc" d="M 375 192 C 388 260, 388 300, 400 344" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#lm-arrow)"></path><g><rect x="400" y="16" width="240" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="520" y="37" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">EU-incorporated model</text><text x="520" y="55" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Mistral, Aleph Alpha</text></g><path id="lm-ea" d="M 640 40 L 668 40" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#lm-arrow)"></path><g><rect x="670" y="16" width="230" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="785" y="37" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">No CLOUD Act exposure</text><text x="785" y="55" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">true sovereign tier</text></g><g><rect x="400" y="168" width="240" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="520" y="189" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">US-owned model, EU host</text><text x="520" y="207" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Bedrock, Vertex, eu.api</text></g><path id="lm-eb" d="M 640 192 L 668 192" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#lm-arrow)"></path><g><rect x="670" y="168" width="230" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="785" y="189" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Residency, not sovereignty</text><text x="785" y="207" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">CLOUD Act still reaches</text></g><g><rect x="400" y="320" width="240" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="520" y="341" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">US-owned model, no EU host</text><text x="520" y="359" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">direct API, older version</text></g><path id="lm-ec" d="M 640 344 L 668 344" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#lm-arrow)"></path><g><rect x="670" y="320" width="230" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="785" y="341" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Defaults to US storage</text><text x="785" y="359" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">no residency at all</text></g><line x1="785" y1="368" x2="785" y2="392" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="781" y="388" width="8" height="8" transform="rotate(45 785 392)" fill="#E8B437"></rect><text x="785" y="396" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">CHECK PER MODEL VERSION</text></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite"><mpath href="#lm-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.6s"></set><animateMotion dur="1.9s" begin="0.6s" repeatCount="indefinite"><mpath href="#lm-fa"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2.4s"></set><animateMotion dur="1.1s" begin="2.4s" repeatCount="indefinite"><mpath href="#lm-ea"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.6s"></set><animateMotion dur="1.7s" begin="0.6s" repeatCount="indefinite"><mpath href="#lm-fb"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2.2s"></set><animateMotion dur="1.1s" begin="2.2s" repeatCount="indefinite"><mpath href="#lm-eb"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0.6s"></set><animateMotion dur="1.9s" begin="0.6s" repeatCount="indefinite"><mpath href="#lm-fc"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="2.4s"></set><animateMotion dur="1.1s" begin="2.4s" repeatCount="indefinite"><mpath href="#lm-ec"></mpath></animateMotion></circle></svg>