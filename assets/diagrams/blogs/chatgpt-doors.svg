<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-label="A prompt containing customer data can go through three doors. Personal account: no data processing agreement, training on by default, so you have handed personal data to a third party. Business workspace: agreement available and no training by default, but European data residency covers Enterprise and Edu, not Business. API project set to Europe: agreement, in-region handling and zero data retention." style="width:100%;height:auto;display:block"><rect width="940" height="340" fill="#061034"/><defs><marker id="cd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><g><rect x="15" y="116" width="190" height="54" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="110" y="140" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Prompt with</text><text x="110" y="158" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">customer data</text></g><path id="cd-a" d="M 205 143 C 225 100, 230 60, 255 54" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#cd-arrow)"></path><path id="cd-a2" d="M 455 54 L 503 54" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#cd-arrow)"></path><g><rect x="257" y="30" width="198" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="356" y="51" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Personal account</text><text x="356" y="69" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Free, Plus, Pro</text></g><g><rect x="505" y="30" width="350" height="48" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="680" y="51" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">No DPA, training on by default</text><text x="680" y="69" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">you handed data to a third party</text></g><path id="cd-b" d="M 205 143 L 253 143" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#cd-arrow)"></path><path id="cd-b2" d="M 455 143 L 503 143" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#cd-arrow)"></path><g><rect x="257" y="119" width="198" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="356" y="140" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Business workspace</text><text x="356" y="158" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">chat interface</text></g><g><rect x="505" y="119" width="350" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="680" y="140" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">DPA, no training by default</text><text x="680" y="158" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">residency covers Enterprise, not Business</text></g><path id="cd-c" d="M 205 143 C 225 190, 230 245, 255 252" fill="none" stroke="#03F856" stroke-width="1.5" marker-end="url(#cd-arrow)"></path><path id="cd-c2" d="M 455 252 L 503 252" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#cd-arrow)"></path><g><rect x="257" y="228" width="198" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="356" y="249" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">API, Europe project</text><text x="356" y="267" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">you build the product</text></g><g><rect x="505" y="228" width="350" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="680" y="249" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">DPA, in-region, zero retention</text><text x="680" y="267" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">you control what is sent</text></g><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite"><mpath href="#cd-a"></mpath></animateMotion></circle><circle r="3.2" fill="#E8B437" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"></set><animateMotion dur="1.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#cd-a2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.3s"></set><animateMotion dur="1s" begin="0.3s" repeatCount="indefinite"><mpath href="#cd-b"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.3s"></set><animateMotion dur="1.4s" begin="1.3s" repeatCount="indefinite"><mpath href="#cd-b2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite"><mpath href="#cd-c"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"></set><animateMotion dur="1.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#cd-c2"></mpath></animateMotion></circle></svg>