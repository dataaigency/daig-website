<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 290" role="img" aria-label="Your last 30 days of queries fork into two meters. Upper lane: bytes scanned, the on-demand meter, priced at 5.66 euros per tebibyte in the EU multi-region. Lower lane: slot-hours allocated by the autoscaler in 50-slot steps, marked as billed at or above what was used, priced at 0.040 euros per slot-hour on EU Standard edition. Both lanes meet at one gate, slot-hours per tebibyte, with a break-even of about 142: under it slots win, over it on-demand wins. The gate leads to the cheaper meter for your workload." style="width:100%;height:auto;display:block"><rect width="1020" height="290" fill="#061034"/><defs><marker id="sb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><g><rect x="15" y="122" width="140" height="56" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="85" y="147" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Your queries</text><text x="85" y="165" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">last 30 days</text></g><path id="sb-fa" d="M 155 150 C 178 150, 176 56, 198 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#sb-arrow)"></path><g><rect x="200" y="32" width="170" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="285" y="53" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Bytes scanned</text><text x="285" y="71" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">on-demand meter</text></g><path id="sb-a1" d="M 370 56 L 428 56" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#sb-arrow)"></pat