<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 205" role="img" aria-label="A question is matched against an index of your documents, the closest passages join it inside a limited context window, and a model drafts the answer from both. A flag under the first box, messy or stale, connects by the same chain to a flag under the model, confident wrong answer." style="width:100%;height:auto;display:block"><rect width="1020" height="205" fill="#061034"/><defs><marker id="rag-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="rag-e0" d="M 193 116 L 211 116" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#rag-arrow)"></path><path id="rag-e1" d="M 391 116 L 409 116" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#rag-arrow)"></path><path id="rag-e2" d="M 589 116 L 607 116" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#rag-arrow)"></path><path id="rag-e3" d="M 787 116 L 805 116" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#rag-arrow)"></path><path id="rag-q" d="M 500 55 L 500 90" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#rag-arrow)"></path><g><rect x="411" y="15" width="178" height="40" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="500" y="39" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Your question</text></g><g><g><rect x="15" y="92" width="178" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="104" y="113" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Your documents</text><text x="104" y="131" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">policies, tickets, contracts</text></g><line x1="104" y1="140" x2="104" y2="165" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="100" y="161" width="8" height="8" transform="rotate(45 104 165)" fill="#E8B437"></rect><text x="104" y="169" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">MESSY OR STALE</text></g></g><g><g><rect x="213" y="92" width="178" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="302" y="113" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Indexed passages</text><text x="302" y="131" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">chunked and searchable</text></g></g><g><g><rect x="411" y="92" width="178" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="500" y="113" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Retrieval</text><text x="500" y="131" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">matches your question</text></g></g><g><g><rect x="609" y="92" width="178" height="48" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="698" y="113" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Context window</text><text x="698" y="131" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">question + a few passages</text></g></g><g><g><rect x="807" y="92" width="180" height="48" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="897" y="113" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Model</text><text x="897" y="131" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">drafts the answer</text></g><line x1="897" y1="140" x2="897" y2="165" stroke="#24356E" stroke-width="1.2" stroke-dasharray="3 4"></line><g><rect x="893" y="161" width="8" height="8" transform="rotate(45 897 165)" fill="#E8B437"></rect><text x="897" y="169" font-size="10.5" letter-spacing="0.8" fill="#E8B437" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" dy="16">CONFIDENT, WRONG ANSWER</text></g></g><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.1s"></set><animateMotion dur="1.2s" begin="0.1s" repeatCount="indefinite"><mpath href="#rag-q"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.3s"></set><animateMotion dur="1.5s" begin="0.3s" repeatCount="indefinite"><mpath href="#rag-e0"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.9s"></set><animateMotion dur="1.5s" begin="0.9s" repeatCount="indefinite"><mpath href="#rag-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.5s"></set><animateMotion dur="1.5s" begin="1.5s" repeatCount="indefinite"><mpath href="#rag-e2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2.1s"></set><animateMotion dur="1.5s" begin="2.1s" repeatCount="indefinite"><mpath href="#rag-e3"></mpath></animateMotion></circle></svg>