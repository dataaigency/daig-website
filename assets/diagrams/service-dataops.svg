<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" role="img" aria-label="Every run is scheduled, built with dbt and tested before anything reaches Gold. When a test fails, the alert comes to the engineer first, never to your stakeholders." style="width:100%;height:auto;display:block"><rect width="460" height="190" fill="#061034"/><defs><marker id="pp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><path id="pp-e1" d="M 126 46 L 156 46" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pp-arrow)"></path><path id="pp-e2" d="M 246 46 L 276 46" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pp-arrow)"></path><path id="pp-e3" d="M 340 68 C 356 92, 370 100, 384 112" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#pp-arrow)"></path><path id="pp-e4" d="M 296 68 C 274 96, 240 104, 216 114" fill="none" stroke="#E8B437" stroke-width="1.5" marker-end="url(#pp-arrow)"></path><g><rect x="16" y="24" width="110" height="44" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="71" y="50" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Airflow / Fabric</text></g><g><rect x="156" y="24" width="90" height="44" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="201" y="50" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">dbt run</text></g><g><rect x="276" y="24" width="90" height="44" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="321" y="50" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">tests</text></g><g><rect x="330" y="112" width="114" height="44" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="387" y="138" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Gold tables</text></g><g><rect x="100" y="112" width="116" height="44" rx="8" fill="#0B1C4E" stroke="#E8B437" stroke-width="1.5"></rect><text x="158" y="138" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">alert, engineer first</text></g><text x="141" y="36" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">SCHEDULE</text><text x="261" y="36" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">BUILD</text><text x="374" y="86" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">PASS</text><text x="240" y="96" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">FAIL</text><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite"><mpath href="#pp-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.8s"></set><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#pp-e2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"></set><animateMotion dur="1.5s" begin="1.6s" repeatCount="indefinite"><mpath href="#pp-e3"></mpath></animateMotion></circle></svg>