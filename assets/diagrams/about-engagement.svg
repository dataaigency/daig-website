<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 200" role="img" aria-label="The whole engagement in one line. From the design onward everything lives in your repositories, so the handover is a formality, not a cliff." style="width:100%;height:auto;display:block"><rect width="1020" height="200" fill="#061034"/><defs><marker id="ab-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A3A6E"></path></marker></defs><g><rect x="206" y="36" width="600" height="128" rx="10" fill="none" stroke="#24356E" stroke-width="1.5" stroke-dasharray="5 4"></rect><text x="222" y="58" font-size="10.5" letter-spacing="1.2" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace">EVERYTHING LIVES IN YOUR REPOSITORIES</text></g><path id="ab-e1" d="M 172 100 L 218 100" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ab-arrow)"></path><path id="ab-e2" d="M 382 100 L 428 100" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ab-arrow)"></path><path id="ab-e3" d="M 592 100 L 638 100" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ab-arrow)"></path><path id="ab-e4" d="M 802 100 L 846 100" fill="none" stroke="#2A3A6E" stroke-width="1.5" marker-end="url(#ab-arrow)"></path><g><rect x="20" y="74" width="152" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="96" y="97" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Intake call</text><text x="96" y="115" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">30 minutes</text></g><g><rect x="220" y="74" width="162" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="301" y="97" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Design</text><text x="301" y="115" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">architecture doc</text></g><g><rect x="430" y="74" width="162" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="511" y="97" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Build</text><text x="511" y="115" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">code · tests · docs</text></g><g><rect x="640" y="74" width="162" height="52" rx="8" fill="#0B1C4E" stroke="#24356E" stroke-width="1.5"></rect><text x="721" y="97" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Handover</text><text x="721" y="115" font-size="10.5" fill="#A9B6D9" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">runbooks &amp; keys</text></g><g><rect x="848" y="74" width="152" height="52" rx="8" fill="#0B1C4E" stroke="#03F856" stroke-width="1.5"></rect><text x="924" y="104" font-size="12.5" font-weight="600" fill="#E8ECF6" font-family="'Hanken Grotesk', 'Segoe UI', sans-serif" text-anchor="middle">Your team runs it</text></g><text x="195" y="90" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">TALK</text><text x="405" y="90" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">AGREE SCOPE</text><text x="615" y="90" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">SHIP WEEKLY</text><text x="824" y="90" font-size="9.5" letter-spacing="0.8" fill="#A9B6D9" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">HAND OVER</text><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0s"></set><animateMotion dur="1.5s" begin="0s" repeatCount="indefinite"><mpath href="#ab-e1"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="0.7s"></set><animateMotion dur="1.5s" begin="0.7s" repeatCount="indefinite"><mpath href="#ab-e2"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="1.4s"></set><animateMotion dur="1.5s" begin="1.4s" repeatCount="indefinite"><mpath href="#ab-e3"></mpath></animateMotion></circle><circle r="3.2" fill="#03F856" opacity="0"><set attributeName="opacity" to="1" begin="2.1s"></set><animateMotion dur="1.5s" begin="2.1s" repeatCount="indefinite"><mpath href="#ab-e4"></mpath></animateMotion></circle></svg>